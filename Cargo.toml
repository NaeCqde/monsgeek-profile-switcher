[package]
name = "monsgeek_profile_switcher"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "monsgeek-profile-switcher"
path = "src/main.rs"

[dependencies]
dotenvy = "0.15"
log = "0.4"
env_logger = "0.11"
eframe = "0.29"
hidapi = "2.6"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
] }
