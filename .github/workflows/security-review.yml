name: security-review

# Claude reads the diff of every pull request and comments on the security problems it finds
# (https://github.com/anthropics/claude-code-action). It signs in with the subscription token in the repository secret
# CLAUDE_CODE_OAUTH_TOKEN (made with `claude setup-token`).
# It only runs for pull requests from this repository, never from forks (a fork has no secrets anyway), and the action
# is pinned to a commit. Dependabot's pull requests are skipped: workflows started by Dependabot get no repository secrets.
on:
    pull_request:

permissions:
    contents: read
    pull-requests: write

concurrency:
    group: security-review-${{ github.ref }}
    cancel-in-progress: true

jobs:
    security-review:
        name: Security review
        if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - uses: anthropics/claude-code-action@9008224dd4f743876f528e6ba0f0d611f076a7f9 # v1.0.271
              with:
                  claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
                  github_token: ${{ github.token }}
                  prompt: |
                      REPO: ${{ github.repository }}
                      PR NUMBER: ${{ github.event.pull_request.number }}

                      Run a security review of the changes in this pull request (the diff against the base branch:
                      `git diff origin/${{ github.base_ref }}...HEAD`). Look for vulnerabilities that can really be exploited:
                      injection, path traversal, SSRF, broken authentication or authorization, secrets in the code, unsafe
                      deserialization, unsafe use of `unsafe`, and dependency problems. Skip style, tests and theoretical issues.
                      Read the surrounding code before you report something, and give the file, the line, how it can be
                      exploited and a fix. Post the result as one comment on the pull request with
                      `gh pr comment ${{ github.event.pull_request.number }} --body-file <file>`; if there is nothing, say so in one line.
                  claude_args: |
                      --max-turns 30
                      --allowedTools "Read,Grep,Glob,Write,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
