name: weekly-security

# Once a week Claude handles the open Dependabot alerts, reads the whole repository against docs/SPEC.md, fixes the
# vulnerabilities it finds, opens a pull request and merges it once the checks pass.
# Needs the secrets CLAUDE_CODE_OAUTH_TOKEN and WEEKLY_SECURITY_TOKEN (a fine-grained PAT of the owner with Dependabot alerts: read,
# Contents: write, Pull requests: write, Workflows: write). The PAT is used for everything (alerts, push, pull request, merge) because
# pushes and pull requests made with GITHUB_TOKEN do not start other workflows, so CI and security-review would never run.
# Without the PAT it falls back to GITHUB_TOKEN: no alerts (audit tools are used instead) and no CI on the pull request.
#
# Once a week, on a weekday and hour of its own (the repositories are spread over the week so that the usage of the
# subscription does not spike), the job first checks in a few seconds whether anything needs Claude: it stops there, without
# calling Claude, unless the default branch has new commits since the last successful run, there are open Dependabot alerts
# that have a patched version, or there are open Dependabot pull requests. On the first run of each month (day 1-7) it
# always calls Claude, to read the code again. A run started by hand always calls Claude unless `force` is turned off.
on:
    schedule:
        - cron: "41 22 * * 6"
    workflow_dispatch:
        inputs:
            force:
                description: "Call Claude even if nothing changed"
                type: boolean
                default: true

permissions:
    contents: write
    pull-requests: write

concurrency:
    group: weekly-security
    cancel-in-progress: false

jobs:
    fix:
        name: Weekly security fix
        runs-on: ubuntu-24.04
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  token: ${{ secrets.WEEKLY_SECURITY_TOKEN || github.token }}
            - name: Does anything need Claude?
              id: gate
              env:
                  GH_TOKEN: ${{ secrets.WEEKLY_SECURITY_TOKEN || github.token }}
                  FORCE: ${{ inputs.force }}
                  EVENT: ${{ github.event_name }}
              run: |
                  run() { echo "run=true" >> "$GITHUB_OUTPUT"; echo "Claude is called: $1"; exit 0; }
                  [ "$EVENT" = "workflow_dispatch" ] && [ "$FORCE" = "true" ] && run "started by hand"
                  [ "$(date -u +%-d)" -le 7 ] && run "monthly full read"
                  last=$(gh run list --workflow weekly-security.yml --status success --limit 1 --json headSha --jq '.[0].headSha // ""') || run "cannot read the runs"
                  [ -z "$last" ] && run "no earlier run"
                  git cat-file -e "$last^{commit}" 2>/dev/null || run "the last checked commit is not in the history"
                  # the job's own merged pull requests and Dependabot's were looked at already
                  new=$(git log --format='%an|%s' "$last..$GITHUB_SHA" | grep -vE '^dependabot\[bot\]\||^[^|]*\|\[weekly-security\]' | wc -l)
                  [ "$new" -gt 0 ] && run "$new new commits since $last"
                  alerts=$(gh api --paginate "repos/$GITHUB_REPOSITORY/dependabot/alerts?state=open" --jq '[.[]|select(.security_vulnerability.first_patched_version != null)]|length' 2>/dev/null | paste -sd+ - | awk '{s+=$1} END {print s+0}') || run "cannot read the alerts"
                  [ "${alerts:-0}" -gt 0 ] && run "$alerts open alerts have a patched version"
                  prs=$(gh pr list --state open --author "app/dependabot" --json number --jq length) || run "cannot read the pull requests"
                  [ "${prs:-0}" -gt 0 ] && run "$prs open Dependabot pull requests"
                  echo "run=false" >> "$GITHUB_OUTPUT"
                  echo "Nothing changed: Claude is not called."
            - uses: anthropics/claude-code-action@9008224dd4f743876f528e6ba0f0d611f076a7f9 # v1.0.271
              if: steps.gate.outputs.run == 'true'
              env:
                  GH_TOKEN: ${{ secrets.WEEKLY_SECURITY_TOKEN || github.token }}
                  HAS_PAT: ${{ secrets.WEEKLY_SECURITY_TOKEN != '' }}
              with:
                  claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
                  github_token: ${{ secrets.WEEKLY_SECURITY_TOKEN || github.token }}
                  prompt: |
                      REPO: ${{ github.repository }}
                      DEFAULT BRANCH: ${{ github.event.repository.default_branch }}

                      Weekly security maintenance. Work on a new branch `security/weekly-<date>`. The title of your pull request must start with `[weekly-security] `
                      (the next run uses it to tell your own merges from new work).
                      0. Open Dependabot pull requests (`gh pr list --author "app/dependabot" --state open`): for each one, wait for its workflow runs (as in step 5);
                         when they pass, merge it with `gh pr merge --squash --delete-branch`. (There is no `Security review` check on
                         them.) When a check fails, try to fix it on the pull request branch; if you cannot, leave a comment with the reason.
                      1. Read `docs/SPEC.md` (if present). It is the up to date specification: when the code disagrees with it, the code is wrong.
                      2. Open Dependabot alerts: `gh api repos/${{ github.repository }}/dependabot/alerts?state=open` when
                         HAS_PAT is true; otherwise use the audit tools of the project (pnpm/bun/npm audit, cargo audit, govulncheck).
                         Fix them by updating the dependency (lockfile too) or adding an override; if no fix exists, leave it and say so.
                      3. Read the whole repository for exploitable vulnerabilities (injection, path traversal, SSRF, broken authentication or
                         authorization, secrets in the code, unsafe deserialization, unsafe `unsafe`) and fix them without changing the behaviour
                         described in SPEC.md. If a fix has to change the behaviour, update SPEC.md in the same change.
                      4. Run the project's build and tests. If anything fails, undo that change.
                      5. If there is nothing to change, stop. Otherwise commit, push the branch, open a pull request
                         (`gh pr create`, the title starts with `[weekly-security]`) listing each alert / finding and what was done. Then wait for the checks. Do not use the checks or
                         statuses APIs (the token cannot read them); use the workflow runs of the pull request branch: checks start a
                         few seconds after the pull request is opened, so run `sleep 60`, then
                         `gh run list --branch <branch> --json databaseId,name,status,conclusion` and `gh run watch <id> --exit-status` for each
                         run that is not finished (repeat the list once if it is empty). The `Security review` run is always expected, so
                         an empty list means the runs have not started yet. When every run has finished and none failed, merge with
                         `gh pr merge --squash --delete-branch`. If a run fails, or the Security review comment reports an exploitable
                         vulnerability, leave the PR open and say why in a comment.
                  claude_args: |
                      --max-turns 80
                      --allowedTools "Read,Grep,Glob,Edit,Write,Bash"
